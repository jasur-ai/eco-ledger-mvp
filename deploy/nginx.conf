# Nginx — Ochiq-Eko-Ledger (xarita + API) uchun teskari proksi.
# O'rnatish: sudo cp deploy/nginx.conf /etc/nginx/sites-available/eco-ledger
#            sudo nano ... (server_name ni o'zgartiring) → certbot --nginx -d eco.example.uz
limit_req_zone $binary_remote_addr zone=eco_api:10m rate=30r/s;

server {
    listen 80;
    server_name eco.example.uz;          # ← o'z domeningizni yozing

    # xarita va ochiq API
    location / {
        limit_req zone=eco_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API hujjati va ochiq eksport — keshlanmaydi
    location ~ ^/(docs|openapi.json|v1/export/) {
        add_header Cache-Control "no-store";
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # bot webhook rejimi (ixtiyoriy): /tg/<secret>
    # location /tg/ {
    #     proxy_pass http://127.0.0.1:8000/webhook;
    #     proxy_set_header Host $host;
    # }

    access_log /var/log/nginx/eco-ledger.access.log;
    error_log  /var/log/nginx/eco-ledger.error.log;
}
